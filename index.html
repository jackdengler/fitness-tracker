    <style>
      #fitness-tracker-v13{width:100%;height:100%;background:light-dark(#f2f2ef,#101110);color:light-dark(#171817,#f5f5f3);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#fitness-tracker-v13 *{box-sizing:border-box}#fitness-tracker-v13 button,#fitness-tracker-v13 input{font:inherit;color:inherit}#fitness-tracker-v13 button{border-radius:0}#fitness-tracker-v13 .app{min-height:700px;height:100%;display:flex;flex-direction:column}#fitness-tracker-v13 .btn{min-height:40px;border:1px solid light-dark(#c9ccc6,#3b3e39);background:transparent;font-weight:850;padding:0 12px}#fitness-tracker-v13 .stage{flex:1;display:flex;flex-direction:column;min-height:0}#fitness-tracker-v13 .head{min-height:62px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid light-dark(#cfd1cc,#343733);background:light-dark(#f8f8f5,#151715)}#fitness-tracker-v13 .title{font-size:27px;font-weight:950;letter-spacing:-.03em}#fitness-tracker-v13 .label{height:30px;display:flex;align-items:center;padding:0 12px;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:light-dark(#686c66,#a7aba5);background:light-dark(#ecece8,#141614);border-bottom:1px solid light-dark(#cfd1cc,#343733)}#fitness-tracker-v13 .syncLine{height:26px;display:flex;align-items:center;padding:0 12px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:light-dark(#8a8e86,#7d817b);border-bottom:1px solid light-dark(#cfd1cc,#343733)}#fitness-tracker-v13 .home{flex:1;display:flex;flex-direction:column;min-height:0;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px))}#fitness-tracker-v13 .resume{border:0;border-bottom:1px solid light-dark(#cfd1cc,#343733);background:light-dark(#171b18,#f2f4f0);color:light-dark(#fff,#111);padding:15px 18px;text-align:left;display:flex;justify-content:space-between;font-weight:900}#fitness-tracker-v13 .resume small{font-size:12px;opacity:.7}#fitness-tracker-v13 .days{display:grid;grid-template-columns:repeat(3,1fr)}#fitness-tracker-v13 .day{min-height:145px;border:0;border-right:1px solid light-dark(#cfd1cc,#343733);border-bottom:1px solid light-dark(#cfd1cc,#343733);background:light-dark(#fff,#191b19);font-size:52px;font-weight:950}#fitness-tracker-v13 .day:last-child{border-right:0}#fitness-tracker-v13 .day span{display:block;font-size:12px;color:light-dark(#72766f,#a8aca6)}#fitness-tracker-v13 .sections{display:grid;grid-template-columns:1fr 1fr}#fitness-tracker-v13 .sectionTile{min-height:140px;border:0;border-right:1px solid light-dark(#cfd1cc,#343733);border-bottom:1px solid light-dark(#cfd1cc,#343733);background:light-dark(#fff,#191b19);padding:18px;text-align:left}#fitness-tracker-v13 .sectionTile:last-child{border-right:0}#fitness-tracker-v13 .sectionTile strong{display:block;font-size:30px;font-weight:950}#fitness-tracker-v13 .sectionTile span{font-size:13px;color:light-dark(#71756f,#a7aba5)}#fitness-tracker-v13 .historyOpen{margin-top:auto;min-height:58px;border:0;border-top:1px solid light-dark(#cfd1cc,#343733);background:light-dark(#edede8,#141614);font-weight:850}#fitness-tracker-v13 .exerciseHead{min-height:64px;padding:7px 10px 7px 12px;border-bottom:1px solid light-dark(#cfd1cc,#343733);display:flex;align-items:center;gap:10px}#fitness-tracker-v13 .exerciseTitle{flex:1;min-width:0}#fitness-tracker-v13 .exerciseName{font-size:clamp(21px,4vw,34px);font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#fitness-tracker-v13 .exerciseMeta{font-size:11px;color:light-dark(#70746e,#a8aca6);font-weight:850}#fitness-tracker-v13 .picker{flex:1;display:grid;grid-template-rows:1fr 1fr;min-height:0}#fitness-tracker-v13 .half{display:flex;flex-direction:column;min-height:0;overflow:hidden;border-bottom:1px solid light-dark(#cfd1cc,#343733)}#fitness-tracker-v13 .rail{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pa acker-v13 .metricVal{font-size:24px;font-weight:950;margin-top:3px}#fitness-tracker-v13 .metricVal.good{color:light-dark(#1e7d32,#4ade80)}#fitness-tracker-v13 .metricVal.warn{color:light-dark(#9a6a00,#e8b339)}#fitness-tracker-v13 .metricVal.bad{color:light-dark(#b3261e,#ff6b5e)}#fitness-tracker-v13 .tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid light-dark(#cfd1cc,#343733)}#fitness-tracker-v13 .tabs button{min-height:48px;border:0;border-right:1px solid light-dark(#cfd1cc,#343733);background:light-dark(#fff,#191b19);font-weight:900;font-size:13px;padding:0 4px}#fitness-tracker-v13 .tabs button:last-child{border-right:0}#fitness-tracker-v13 .tabs .active{background:light-dark(#171b18,#f2f4f0);color:light-dark(#fff,#111)}#fitness-tracker-v13 .library{flex:1;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px))}#fitness-tracker-v13 .mealCard,#fitness-tracker-v13 .foodRow,#fitness-tracker-v13 .logRow{border-bottom:1px solid light-dark(#d4d6d1,#30332f);background:light-dark(#fff,#191b19);padding:14px 12px}#fitness-tracker-v13 .mealTop,#fitness-tracker-v13 .foodTop,#fitness-tracker-v13 .logTop{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}#fitness-tracker-v13 .foodName{font-weight:950;font-size:17px}#fitness-tracker-v13 .serving{font-size:12px;color:light-dark(#70746e,#a8aca6);margin-top:2px}#fitness-tracker-v13 .macroLine{font-size:12px;margin-top:6px;color:light-dark(#555a54,#bdc1bb)}#fitness-tracker-v13 .note{font-size:11px;margin-top:5px;color:light-dark(#777b75,#999e97)}#fitness-tracker-v13 .add{min-width:68px;min-height:54px;border:0;background:light-dark(#171b18,#f2f4f0);color:light-dark(#fff,#111);font-weight:900}#fitness-tracker-v13 details{margin-top:9px;border-top:1px solid light-dark(#e1e2df,#2c2f2b);padding-top:8px}#fitness-tracker-v13 summary{cursor:pointer;font-size:12px;font-weight:900;color:light-dark(#676b65,#a9ada7)}#fitness-tracker-v13 .ingredientMini{display:flex;justify-con font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.28);animation:undoIn .18s ease-out}#fitness-tracker-v13 .undoToast button{background:none;border:0;color:inherit;font-weight:950;text-decoration:underline;padding:0;min-height:auto}@keyframes undoIn{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}@media(max-width:560px){#fitness-tracker-v13 .app{min-height:640px}#fitness-tracker-v13 .choice{flex-basis:38%;font-size:40px}#fitness-tracker-v13 .metrics{grid-template-columns:repeat(2,1fr)}#fitness-tracker-v13 .metric:nth-child(3n){border-right:1px solid light-dark(#cfd1cc,#343733)}#fitness-tracker-v13 .metric:nth-child(2n){border-right:0}#fitness-tracker-v13 .metric:nth-child(n+3){border-top:1px solid light-dark(#cfd1cc,#343733)}#fitness-tracker-v13 .bodyForms{grid-template-columns:1fr}#fitness-tracker-v13 .form:first-child{border-right:0;border-bottom:1px solid light-dark(#cfd1cc,#343733)}}#fitness-tracker-v13 .foodDayList>details{margin-top:0;border-top:0;padding-top:0;border-bottom:1px solid light-dark(#cfd1cc,#343733)}#fitness-tracker-v13 .foodTableHead,#fitness-tracker-v13 .foodTableRow{display:grid;grid-template-columns:1fr 46px 34px 34px 32px 32px 24px;gap:4px;align-items:center}#fitness-tracker-v13 .foodTableHead>span,#fitness-tracker-v13 .foodTableRow>span{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}#fitness-tracker-v13 .foodTableHead>span:first-child,#fitness-tracker-v13 .foodTableRow>span:first-child{text-align:left;display:flex;align-items:center;gap:4px;min-width:0}#fitness-tracker-v13 .cellName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}#fitness-tracker-v13 .foodTableHead{padding:8px 12px;font-size:9px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:light-dark(#6d716b,#a8aca6);background:light-dark(#ecece8,#141614);border-bottom:1px solid light-dark(#cfd1cc,#343733)}#fitness-tracker-v13 .foodDaySummary{display:block;cursor:pointer;padding:10px 12px;margin:0;background:light-dark(#f4f4f1,#181a18);color:inherit}#fitness-tracker-v13 .foodDaySummary .foodTableRow{font-size:12px;font-weight:900}#fitness-tracker-v13 .chevron{display:inline-block;transition:transform .15s;font-size:10px;flex:0 0 auto}#fitness-tracker-v13 details[open]>.foodDaySummary .chevron{transform:rotate(90deg)}#fitness-tracker-v13 .foodItemRow{padding:9px 12px 9px 22px;border-bottom:1px solid light-dark(#ecece8,#272a27);cursor:pointer;background:light-dark(#fff,#191b19)}#fitness-tracker-v13 .foodItemRow .foodTableRow{font-size:11.5px;color:light-dark(#3d403c,#d8dad6)}#fitness-tracker-v13 .foodDeleteBtn{min-width:22px;min-height:22px;border:0;background:transparent;font-weight:900;font-size:15px;padding:0;color:light-dark(#a3413c,#ff8478)}
    </style>
    <style>
      /* --- Shared tokens, charts, calendar, compact macro strip, polish --- */
      #fitness-tracker-v13 {
        --line: light-dark(#cfd1cc, #343733);
        --line-soft: light-dark(#e6e7e3, #272a27);
        --surface: light-dark(#fff, #191b19);
        --surface-2: light-dark(#f8f8f5, #151715);
        --ink: light-dark(#171817, #f5f5f3);
        --muted: light-dark(#70746e, #a8aca6);
        --ch-1: light-dark(#2a78d6, #3987e5);
        --ch-2: light-dark(#eb6834, #d95926);
        --ch-3: light-dark(#1baf7a, #199e70);
        --ch-bad: light-dark(#b3261e, #ff6b5e);
        --ch-grid: light-dark(#e4e5e1, #2a2d29);
        --ch-band: light-dark(rgba(23, 27, 24, 0.07), rgba(242, 244, 240, 0.1));
        --ch-over: light-dark(#fbe9e7, #33201d);
        -webkit-tap-highlight-color: transparent;
      }
      #fitness-tracker-v13 button {
        touch-action: manipulation;
      }
      #fitness-tracker-v13 :focus-visible {
        outline: 2px solid var(--ch-1);
        outline-offset: -2px;
      }
      #fitness-tracker-v13 .btn,
      #fitness-tracker-v13 .submit,
      #fitness-tracker-v13 .add,
      #fitness-tracker-v13 .delete,
      #fitness-tracker-v13 input,
      #fitness-tracker-v13 select {
        border-radius: 8px;
      }
      #fitness-tracker-v13 .btn:active,
      #fitness-tracker-v13 .submit:active,
      #fitness-tracker-v13 .add:active,
      #fitness-tracker-v13 .sectionTile:active,
      #fitness-tracker-v13 .day:active {
        filter: brightness(0.96);
      }
      #fitness-tracker-v13 .metricVal,
      #fitness-tracker-v13 .logged,
      #fitness-tracker-v13 .seconds,
      #fitness-tracker-v13 .macroCal {
        font-variant-numeric: tabular-nums;
      }
      #fitness-tracker-v13 .foodTableHead {
        position: sticky;
        top: 0;
        z-index: 4;
      }
      #fitness-tracker-v13 .day.todayPlan {
        box-shadow: inset 0 -4px 0 var(--ch-1);
      }
      #fitness-tracker-v13 .empty {
        padding: 22px 14px;
        text-align: center;
        font-size: 13px;
        font-weight: 850;
        color: var(--muted);
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      /* Cards + charts */
      #fitness-tracker-v13 .card {
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        padding: 12px;
      }
      #fitness-tracker-v13 .cardHead {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }
      #fitness-tracker-v13 .cardTitle {
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #fitness-tracker-v13 .cardNote {
        font-size: 11px;
        font-weight: 850;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      #fitness-tracker-v13 .chartReadout {
        min-height: 15px;
        margin: 6px 0 2px;
        font-size: 11px;
        font-weight: 850;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      #fitness-tracker-v13 .chart {
        display: block;
        width: 100%;
        height: auto;
        touch-action: pan-y;
      }
      #fitness-tracker-v13 .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        margin-top: 8px;
        font-size: 11px;
        font-weight: 850;
        color: var(--muted);
      }
      #fitness-tracker-v13 .legend span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      #fitness-tracker-v13 .swatch {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        flex: 0 0 auto;
      }
      #fitness-tracker-v13 .swatch.dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      #fitness-tracker-v13 .swatch.line {
        width: 14px;
        height: 3px;
        border-radius: 2px;
      }
      #fitness-tracker-v13 .swatch.dash {
        width: 14px;
        height: 0;
        border-top: 2px dashed currentColor;
        border-radius: 0;
      }
      /* Calendar */
      #fitness-tracker-v13 .calNav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      #fitness-tracker-v13 .calNav button {
        min-width: 38px;
        min-height: 32px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        font-weight: 900;
      }
      #fitness-tracker-v13 .calMonth {
        font-size: 15px;
        font-weight: 950;
      }
      #fitness-tracker-v13 .calGrid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 3px;
      }
      #fitness-tracker-v13 .calDow {
        text-align: center;
        font-size: 9px;
        font-weight: 900;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        padding-bottom: 2px;
      }
      #fitness-tracker-v13 .calCell {
        aspect-ratio: 1 / 1.15;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 3px 1px 0;
        border: 1px solid var(--line-soft);
        border-radius: 6px;
        background: var(--surface);
      }
      #fitness-tracker-v13 .calCell.blank {
        border: 0;
        background: transparent;
      }
      #fitness-tracker-v13 .calCell.over {
        background: var(--ch-over);
      }
      #fitness-tracker-v13 .calCell.missed {
        border-style: dashed;
        border-color: var(--ch-bad);
      }
      #fitness-tracker-v13 .calCell.today {
        box-shadow: inset 0 0 0 2px var(--ink);
      }
      #fitness-tracker-v13 .calNum {
        font-size: 10px;
        font-weight: 850;
        line-height: 1;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      #fitness-tracker-v13 .calLift {
        min-width: 16px;
        height: 16px;
        padding: 0 3px;
        border-radius: 5px;
        background: var(--ch-1);
        color: #fff;
        font-size: 10px;
        font-weight: 950;
        line-height: 16px;
        text-align: center;
      }
      #fitness-tracker-v13 .calDots {
        display: flex;
        gap: 3px;
        margin-top: auto;
        margin-bottom: 4px;
        min-height: 5px;
      }
      #fitness-tracker-v13 .calDot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
      }
      #fitness-tracker-v13 .calSummary {
        margin-top: 10px;
        font-size: 11px;
        font-weight: 850;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      /* Compact calories + macros strip */
      #fitness-tracker-v13 .macroStrip {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 9px 12px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      #fitness-tracker-v13 .macroTop {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }
      #fitness-tracker-v13 .macroCal {
        font-size: 24px;
        font-weight: 950;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      #fitness-tracker-v13 .macroCal.good {
        color: light-dark(#1e7d32, #4ade80);
      }
